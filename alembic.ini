# Alembic configuration for Advanced RAG Enterprise Database Migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Prepend current directory to sys.path so advanced_rag can be imported
prepend_sys_path = .
path_separator = os

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Default output encoding
output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
