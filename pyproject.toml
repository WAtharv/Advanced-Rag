[project]
name = "advanced-rag"
version = "0.1.0"
description = "Enterprise Advanced RAG for Kubernetes IT operations: hybrid search, reranking, HyDE, CRAG, Self-RAG, Text2SQL, caching and guardrails on LangGraph"
readme = "Readme.md"
requires-python = ">=3.11"

dependencies = [
    # Free-first Hosted LLM
    "groq>=0.11",
    # Orchestration
    "langgraph>=0.2.60",
    # Retrieval
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    # Porter2 stemmer for the no-download BM25 backend (pure Python, no model).
    "snowballstemmer>=2.2",
    # API + UI (the web UI is plain HTML/CSS/JS served by FastAPI - no build step)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx",
    "python-multipart>=0.0.9",
    # Data / cache
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "sqlglot>=30.0.0,<31.0.0",
    "alembic>=1.13.0",
    # Config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Corporate TLS proxies: validate against the OS trust store, not certifi.
    "truststore>=0.9",
    # Multi-format document ingestion
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# Optional paid LLM backends:
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
# Persistent LangGraph checkpointer for multi-replica deploys (CHECKPOINT_BACKEND=postgres).
postgres-checkpoint = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
eval = ["ragas>=0.2", "datasets>=3.0", "pandas>=2.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
rag-ingest = "advanced_rag.ingestion.cli:main"
rag-api = "advanced_rag.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_rag"]

# Ship the web UI inside the wheel; api/main.py looks for it here first and
# falls back to `ui/web` in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"ui/web" = "advanced_rag/api/web"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
